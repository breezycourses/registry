[package]
name = "breezy-registry"
version = "0.1.0"
edition = "2021"
description = "Breezy Registry — a single-binary OCI container registry"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
diesel = { version = "2", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
object_store = { version = "0.14.1", features = ["aws"] }
async-trait = "0.1.92"
fs2 = "0.4.3"
rust-embed = { version = "8.12.0", features = ["axum"] }
mime_guess = "2.0.5"

[profile.release]
lto = true
strip = true
