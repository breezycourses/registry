{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "breezy-registry.fullname" . }}-config
  labels:
    {{- include "breezy-registry.labels" . | nindent 4 }}
stringData:
  breezy.toml: |
    listen = "0.0.0.0:{{ .Values.service.port }}"
    data_dir = "/data"
    public_pull = {{ .Values.config.publicPull }}
    gc_grace_seconds = {{ .Values.config.gcGraceSeconds }}
    ui = {{ .Values.ui.enabled }}
    {{- range .Values.users }}

    [[users]]
    username = {{ .username | quote }}
    password = {{ .password | quote }}
    role = {{ .role | default "push" | quote }}
    {{- end }}
    {{- if .Values.objectStorage.enabled }}

    [object_storage]
    endpoint = {{ .Values.objectStorage.endpoint | quote }}
    bucket = {{ .Values.objectStorage.bucket | quote }}
    region = {{ .Values.objectStorage.region | quote }}
    {{- end }}
    {{- if .Values.sharding.enabled }}

    [sharding]
    # self_url is overridden per pod via the BREEZY_SELF_URL env var.
    self_url = {{ include "breezy-registry.podUrl" (list . 0) | quote }}
    shards = [
      {{- range $i := until (int .Values.replicaCount) }}
      {{ include "breezy-registry.podUrl" (list $ $i) | quote }},
      {{- end }}
    ]
    {{- end }}
{{- end }}
