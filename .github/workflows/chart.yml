# Publishes the Helm chart as a GitHub Pages chart repository
# (https://breezycourses.github.io/registry), which Artifact Hub indexes.
# chart-releaser only cuts a release when charts/breezy-registry/Chart.yaml's
# `version` changes — bump it to publish.
name: Release chart

on:
  push:
    branches: [main]
    paths: ["charts/**"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
